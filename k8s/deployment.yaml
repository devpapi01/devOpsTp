apiVersion: apps/v1
kind: Deployment
metadata:
  name: projetmpisi-app
  labels:
    app: projetmpisi-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: projetmpisi-app
  template:
    metadata:
      labels:
        app: projetmpisi-app
    spec:
      containers:
        - name: springboot-app
          image: projetmpisi-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/projetmpisi_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

            - name: SPRING_DATASOURCE_USERNAME
              value: root

            - name: SPRING_DATASOURCE_PASSWORD
              value: root
